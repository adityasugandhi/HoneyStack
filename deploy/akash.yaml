# Trap SDL (CI template). CI renders ${PLACEHOLDERS} with envsubst at deploy time,
# so no secret is committed. The trap runs on Akash (public) and talks to the
# control server through CONTROL_URL (the cloudflared tunnel) with INGEST_TOKEN.
# ClickHouse + shell-brain + Guild all live behind that tunnel, not on Akash.
version: "2.0"
services:
  trap:
    image: ${TRAP_IMAGE}
    env:
      - NODE_ENV=production
      - PORT=3000
      - TRAP_INSTANCE_ID=demo-1
      - DEMO_MODE=false
      - CONTROL_URL=${CONTROL_URL}
      - INGEST_TOKEN=${INGEST_TOKEN}
      - CALLBACK_ALLOWLIST=${CALLBACK_ALLOWLIST}
      - REVSHELL_HOLD_MS=30000
    expose:
      - port: 3000
        as: 80
        to:
          - global: true
profiles:
  compute:
    trap:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 512Mi
  placement:
    demo:
      pricing:
        trap:
          denom: uact
          amount: 10000
deployment:
  trap:
    demo:
      profile: trap
      count: 1
