# Trap SDL. Validate in Akash Console before deploying (spec 12.1).
# Secrets stay OUT of git: fill INGEST_TOKEN in the Console SDL editor, not here.
# Image MUST be linux/amd64 and digest-pinned (build with scripts/build-trap.sh).
version: "2.0"
services:
  trap:
    image: ghcr.io/adityasugandhi/honeystack-trap@sha256:2801db477694dedc414a74930e9a68c8144e417e1aae983cc3462233f47388f8
    env:
      - NODE_ENV=production
      - PORT=3000
      - TRAP_INSTANCE_ID=demo-1
      - DEMO_MODE=false
      # Base URL of the control server behind the HTTPS tunnel (cloudflared).
      # The trap calls ${CONTROL_URL}/v1/shell/* and /v1/events/batch.
      - CONTROL_URL=REPLACE_WITH_HTTPS_TUNNEL_URL
      # Producer token — set in the Console SDL editor only, never committed.
      - INGEST_TOKEN=REPLACE_IN_CONSOLE
      # IPv4 the reverse shell may call back to (the attacker's public listener).
      - CALLBACK_ALLOWLIST=REPLACE_WITH_LISTENER_IPV4
      - REVSHELL_HOLD_MS=30000
    expose:
      - port: 3000
        as: 80
        proto: tcp
        to:
          - global: true
profiles:
  compute:
    trap:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 512Mi
  placement:
    demo:
      pricing:
        trap:
          denom: uact          # validated by the hello-world deploy
          amount: 1000
deployment:
  trap:
    demo:
      profile: trap
      count: 1
