name: ClickHouse integration test

# Manual only: it hits the real ClickHouse service, so it should not run on
# every push. Run it from the Actions tab (or `gh workflow run clickhouse-it`).
# Config: URL + USER are repo variables (not sensitive); PASSWORD is a secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # needs >= 23.6 so .mjs can import the .ts schema
          cache: npm
      - run: npm ci

      # Trim whitespace and fail clearly if a value is missing. Without
      # CLICKHOUSE_URL the ClickHouse cases skip, and a green-but-skipped run
      # would be misleading.
      - name: Resolve ClickHouse config
        env:
          CH_URL: ${{ vars.CLICKHOUSE_URL }}
          CH_USER: ${{ vars.CLICKHOUSE_USER }}
        run: |
          url=$(printf '%s' "$CH_URL" | tr -d '[:space:]')
          user=$(printf '%s' "$CH_USER" | tr -d '[:space:]')
          [ -n "$url" ]  || { echo "::error::CLICKHOUSE_URL variable is empty";  exit 1; }
          [ -n "$user" ] || { echo "::error::CLICKHOUSE_USER variable is empty"; exit 1; }
          echo "CLICKHOUSE_URL=$url"   >> "$GITHUB_ENV"
          echo "CLICKHOUSE_USER=$user" >> "$GITHUB_ENV"

      - name: Run tests (including the live ClickHouse round-trip)
        env:
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: npm test
