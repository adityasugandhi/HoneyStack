name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run build:css
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Tailwind CSS (for the trap image)
        run: |
          npm ci || npm install
          npm run build:css
      - name: Build trap image
        run: docker build -f Dockerfile.trap -t honeystack-trap:ci .
      - name: Build control image
        run: docker build -f Dockerfile.control -t honeystack-control:ci .
