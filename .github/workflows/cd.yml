name: CD — build & deploy to Akash

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: trap
            dockerfile: Dockerfile.trap
            css: "true"
          - name: control
            dockerfile: Dockerfile.control
            css: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for Tailwind CSS)
        if: matrix.css == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Tailwind CSS
        if: matrix.css == 'true'
        run: |
          npm ci || npm install
          npm run build:css

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/honeystack-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/honeystack-${{ matrix.name }}:${{ github.sha }}

  # Deploy the trap to Akash, pointed at the live control tunnel (CONTROL_URL).
  # The control server + ClickHouse + Guild run behind that tunnel, not on Akash.
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render trap SDL and deploy to Akash
        env:
          AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
          SKIP_PROVIDERS: ${{ vars.SKIP_PROVIDERS }}
          TRAP_IMAGE: ghcr.io/${{ github.repository_owner }}/honeystack-trap:${{ github.sha }}
          CONTROL_URL: ${{ vars.CONTROL_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CALLBACK_ALLOWLIST: ${{ vars.CALLBACK_ALLOWLIST }}
        run: |
          set -eu
          command -v envsubst >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y gettext-base)
          envsubst '${TRAP_IMAGE} ${CONTROL_URL} ${INGEST_TOKEN} ${CALLBACK_ALLOWLIST}' \
            < deploy/akash.yaml > /tmp/trap.rendered.yaml
          echo "::group::Rendered SDL (secrets redacted)"
          grep -vE 'TOKEN|PASSWORD|KEY' /tmp/trap.rendered.yaml || true
          echo "::endgroup::"
          sh scripts/deploy-stack.sh /tmp/trap.rendered.yaml | tee /tmp/deploy.out
          {
            echo "## Akash trap deploy";
            grep -E 'DSEQ:|Service URI:' /tmp/deploy.out || echo "(no URI captured)";
            echo "";
            echo "Control tunnel: \`${CONTROL_URL}\`";
            echo "> If the trap URL 404s, make the **honeystack-trap** GHCR package public (Actions pushes it private by default).";
          } >> "$GITHUB_STEP_SUMMARY"
