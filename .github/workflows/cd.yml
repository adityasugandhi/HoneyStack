name: CD — build & deploy to Akash

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_full:
        description: "Deploy the FULL stack (trap + control on Akash, ClickHouse Cloud)"
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-trap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Tailwind CSS
        run: |
          npm ci || npm install
          npm run build:css
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push trap (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.trap
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/honeystack-trap:latest
            ghcr.io/${{ github.repository_owner }}/honeystack-trap:${{ github.sha }}

  # Deploy the trap to Akash, pointed at the live control tunnel (CONTROL_URL),
  # then auto-sync the live URL into README.md (the URL is dynamic per deploy).
  deploy:
    needs: build-trap
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the README URL update back to main
    steps:
      - uses: actions/checkout@v4
      - name: Render trap SDL and deploy to Akash
        env:
          AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
          GH_TOKEN: ${{ github.token }}          # gh pr create for the README sync branch
          SKIP_PROVIDERS: ${{ vars.SKIP_PROVIDERS }}
          # Only reconcile to one-trap and touch main from a main run. A PR/branch
          # run deploys a throwaway trap, verifies it, and leaves main's lease alone.
          CLOSE_STALE: ${{ github.ref_name == 'main' && '1' || '0' }}
          ON_MAIN: ${{ github.ref_name == 'main' && 'yes' || 'no' }}
          REF_NAME: ${{ github.ref_name }}
          RENDER_FULL: ${{ (github.event.inputs.deploy_full == 'true' || vars.DEPLOY_FULL == '1') && 'yes' || 'no' }}
          CLICKHOUSE_URL: ${{ vars.CLICKHOUSE_URL }}
          CLICKHOUSE_USER: ${{ vars.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SHELL_BACKEND: ${{ vars.SHELL_BACKEND }}
          GUILD_TRIGGER_KEY: ${{ secrets.GUILD_TRIGGER_KEY }}
          GUILD_OWNER: ${{ secrets.GUILD_OWNER }}
          GUILD_WORKSPACE: ${{ secrets.GUILD_WORKSPACE }}
          CONTROL_IMAGE: ghcr.io/${{ github.repository_owner }}/honeystack-control:${{ github.sha }}
          TRAP_IMAGE: ghcr.io/${{ github.repository_owner }}/honeystack-trap:${{ github.sha }}
          CONTROL_URL: ${{ vars.CONTROL_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CALLBACK_ALLOWLIST: ${{ vars.CALLBACK_ALLOWLIST }}
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y gettext-base)
          if [ "$RENDER_FULL" = "yes" ]; then
            # Full stack: trap + control on Akash (control talks to ClickHouse Cloud).
            # Unset secrets (LLM/GUILD) substitute as empty — the shell brain then
            # serves the fast path only and analyst routes degrade gracefully.
            export SHELL_BACKEND="${SHELL_BACKEND:-anthropic}"
            envsubst '${TRAP_IMAGE} ${CONTROL_IMAGE} ${CLICKHOUSE_URL} ${CLICKHOUSE_USER} ${CLICKHOUSE_PASSWORD} ${INGEST_TOKEN} ${CONTROL_TOKEN} ${LLM_API_KEY} ${GUILD_TRIGGER_KEY} ${GUILD_OWNER} ${GUILD_WORKSPACE} ${CALLBACK_ALLOWLIST} ${SHELL_BACKEND}' \
              < deploy/akash-full.yaml > /tmp/trap.rendered.yaml
          else
            envsubst '${TRAP_IMAGE} ${CONTROL_URL} ${INGEST_TOKEN} ${CALLBACK_ALLOWLIST}' \
              < deploy/akash.yaml > /tmp/trap.rendered.yaml
          fi
          echo "::group::Rendered SDL (secrets redacted)"
          grep -vE 'TOKEN|PASSWORD|KEY' /tmp/trap.rendered.yaml || true
          echo "::endgroup::"
          # deploy-stack.sh deploys, waits for the ingress URL, verifies it, and
          # closes stale leases (CLOSE_STALE=1). Read DSEQ + URL from its output.
          sh scripts/deploy-stack.sh /tmp/trap.rendered.yaml | tee /tmp/deploy.out
          DSEQ="$(grep -oE 'DSEQ: [0-9]+' /tmp/deploy.out | head -1 | awk '{print $2}')"
          URI="$(grep -oE 'Service URI: [^ ]+' /tmp/deploy.out | awk '{print $3}' | grep -v 'not-ready-yet' || true)"
          echo "Resolved DSEQ=$DSEQ URI=${URI:-<pending>}"
          if [ "$ON_MAIN" != "yes" ]; then
            echo "Not on main (ref=$REF_NAME): skipping README auto-commit; main's lease untouched."
            echo "NOTE: this branch run left a throwaway trap at DSEQ=$DSEQ — close it with scripts/close-deployment.sh $DSEQ"
          else
            sh scripts/update-readme.sh "$DSEQ" "$URI" "$TRAP_IMAGE" "$CONTROL_URL"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            if git diff --cached --quiet; then
              echo "README already current."
            else
              # main is branch-protected: push to a sync branch and open a PR.
              git commit -m "docs: auto-update live Akash trap URL [skip ci]"
              git push -f origin "HEAD:docs/akash-url-sync"
              gh pr create --base main --head docs/akash-url-sync \
                --title "docs: update live Akash URLs (auto)" \
                --body "Automated from the CD deploy. Merge to refresh the README table." \
                || echo "README sync PR already open — branch updated."
            fi
          fi
          {
            echo "## Akash trap deploy";
            echo "- DSEQ: \`$DSEQ\`";
            echo "- Live URL: http://${URI:-pending}/";
            echo "- Control tunnel: \`${CONTROL_URL}\`";
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional: build+push the control image too (not on the deploy critical path;
  # used for the all-on-Akash option in deploy/akash-full.yaml). New package, so
  # the Actions token can create it. Does not block the trap deploy if it fails.
  build-control:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push control (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.control
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/honeystack-control:latest
            ghcr.io/${{ github.repository_owner }}/honeystack-control:${{ github.sha }}
